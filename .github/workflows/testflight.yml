# TestFlight 업로드.
#
# 실기기에서만 확인되는 것들이 쌓여 있다 — 손그림 손맛, 공유 익스텐션이 카카오맵에서
# 실제로 받는 값, App Group 저장. 시뮬레이터로는 여기까지가 한계다.
#
# 서명은 인증서 저장소를 따로 두지 않는다(fastlane match 같은 방식). 대신 xcodebuild가
# App Store Connect API 키로 실행 중에만 쓸 개발 인증서와 프로파일을 발급받는다.
# 임시 러너가 끝난 뒤 인증서만 Apple 계정에 쌓이지 않도록 시작 전과 종료 시
# `Created via API` 개발 인증서만 정리한다. 개인 인증서와 배포 인증서는 건드리지 않는다.
name: TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 두 실행이 서로의 임시 인증서를 지우지 않게 서명 작업은 한 번에 하나만 돌린다.
concurrency:
  group: testflight-signing
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 필요한 값이 다 있는지 먼저 본다
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # 30분짜리 빌드를 다 돌리고 마지막에 "값이 없다"로 실패하면 시간이 아깝다.
          missing=""
          [ -z "$KEY_ID" ]      && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]   && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$PRIVATE_KEY" ] && missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "❌ 빠진 시크릿:$missing"
            exit 1
          fi
          echo "✅ 시크릿은 다 있다"

      - name: 도구 버전
        run: xcodebuild -version

      - name: API 키를 xcodebuild가 찾는 자리에 둔다
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # 도구마다 키를 찾는 자리가 다르다. altool은 ~/.appstoreconnect/private_keys를,
          # xcodebuild는 넘겨준 경로를 본다. 어디를 보든 걸리도록 양쪽에 둔다.
          for dir in ~/private_keys ~/.appstoreconnect/private_keys; do
            mkdir -p "$dir"
            printf '%s' "$PRIVATE_KEY" > "$dir/AuthKey_${KEY_ID}.p8"
            chmod 600 "$dir/AuthKey_${KEY_ID}.p8"
          done

          # 내용은 절대 찍지 않는다. 실제로 파싱되는지로 확인한다.
          #
          # 첫 줄에 BEGIN이 있는지만 보는 것으로는 부족하다. 줄바꿈이 뭉개져 한 줄로
          # 붙어 있어도 첫 줄은 멀쩡해 보이는데, PEM으로는 깨진 것이라 한참 뒤에
          # "Authentication failed"로 엉뚱한 데서 죽는다.
          if openssl pkey -in ~/private_keys/AuthKey_${KEY_ID}.p8 -noout 2>/dev/null; then
            echo "✅ 키가 정상적으로 파싱된다"
          else
            echo "❌ .p8을 열 수 없다. PEM 형식이 깨졌다."
            echo "   줄 수:    $(wc -l < ~/private_keys/AuthKey_${KEY_ID}.p8)"
            echo "   BEGIN 줄: $(grep -c 'BEGIN PRIVATE KEY' ~/private_keys/AuthKey_${KEY_ID}.p8 || true)"
            echo "   END 줄:   $(grep -c 'END PRIVATE KEY' ~/private_keys/AuthKey_${KEY_ID}.p8 || true)"
            echo "   .p8을 메모장으로 열어 BEGIN/END 줄과 줄바꿈까지 그대로 넣어야 한다."
            exit 1
          fi

      - name: 팀 ID 알아내기
        id: team
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          OVERRIDE: ${{ vars.APPLE_TEAM_ID }}
        run: |
          # xcodebuild는 팀을 스스로 찾지 못한다. "requires a development team"으로
          # 아카이브가 죽는다. 그렇다고 사람에게 10자리를 찾아오라고 시킬 이유는 없다.
          # 이미 CI에 있는 API 키로 인증서를 조회하면 그 안에 팀 ID가 들어 있다.
          # 러너의 파이썬은 외부 관리 환경이라 그냥 설치하면 PEP 668로 막힌다.
          # 이미 있으면 건드리지 않고, 없을 때만 플래그를 붙인다.
          python3 -c "import cryptography" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages cryptography

          # 변수로 팀을 지정했더라도 키 점검은 반드시 한다.
          # 지정하면 이 경로를 건너뛰게 해 뒀더니, 키가 API에 통하는지 한 번도
          # 확인하지 못한 채 아카이브까지 갔다가 "Authentication failed"로 죽었다.
          # 그 메시지만으로는 키가 틀린 건지 권한이 모자란 건지 알 수 없다.
          set +e
          DETECTED=$(python3 scripts/apple_team_id.py "$KEY_ID" "$ISSUER_ID" "$HOME"/private_keys/AuthKey_${KEY_ID}.p8 2>team.err)
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "❌ API 키가 인증서·프로파일 API에 통하지 않는다:"
            cat team.err
            exit 1
          fi
          echo "✅ API 키 정상. 인증서에서 읽은 팀: $DETECTED"

          if [ -n "$OVERRIDE" ]; then
            if [ "$OVERRIDE" != "$DETECTED" ]; then
              echo "⚠️  변수($OVERRIDE)와 인증서($DETECTED)가 다르다. 변수를 따른다."
            fi
            echo "TEAM_ID=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TEAM="$DETECTED"
          if [ -z "$TEAM" ]; then
            echo "❌ 팀 ID를 알아내지 못했다."
            echo "   developer.apple.com > Account > Membership 의 Team ID(10자리)를"
            echo "   저장소 Variables에 APPLE_TEAM_ID로 넣으면 이 단계를 건너뛴다."
            exit 1
          fi
          echo "TEAM_ID=$TEAM" >> "$GITHUB_OUTPUT"
          echo "✅ 팀 ID: $TEAM"

      - name: 키 권한 점검
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # xcodebuild는 무엇이 막혀도 "Authentication failed"라고만 말한다.
          # 자동 서명이 실제로 쓰는 엔드포인트를 하나씩 두드려 상태 코드를 본다.
          python3 scripts/apple_key_check.py             "$KEY_ID" "$ISSUER_ID" "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: 인증서 정리 필터를 테스트한다
        run: python3 scripts/test_apple_certificate_cleanup.py

      - name: 이전 CI 개발 인증서를 정리한다
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # 임시 러너에는 과거 인증서의 개인키가 없다. 이름과 종류가 모두 일치하는
          # `Created via API` 개발 인증서만 없애 슬롯을 확보한다.
          python3 scripts/apple_certificate_cleanup.py \
            "$KEY_ID" "$ISSUER_ID" "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: ios
        env:
          TEAM_ID: ${{ steps.team.outputs.TEAM_ID }}
        run: |
          # 팀 ID를 사람에게 묻지 않는다. -allowProvisioningUpdates와 API 키를 주면
          # xcodebuild가 인증서·프로파일을 발급받으면서 팀도 스스로 찾는다.
          #
          # altool --list-providers로 미리 알아내려 했지만 그 명령은 API 키 인증을
          # 지원하지 않는다("list-providers does not support APIKey authentication").
          # Apple ID 비밀번호가 필요한데 그건 CI에 둘 값이 아니다.
          #
          # 계정에 팀이 여럿이면 xcodebuild가 고르지 못한다. 그때만 변수로 지정한다.
          if [ -n "$TEAM_ID" ]; then
            echo "DEVELOPMENT_TEAM = $TEAM_ID" > Config.xcconfig
            echo "팀을 변수로 지정했다: $TEAM_ID"
          else
            : > Config.xcconfig
            echo "팀은 xcodebuild가 알아서 찾는다"
          fi
          xcodegen generate

      - name: 아카이브
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://map-line-production.up.railway.app' }}
        run: |
          set -o pipefail
          # 서명 설정을 명령줄에서 덮어쓰지 않는다.
          #
          # CODE_SIGNING_REQUIRED와 CODE_SIGN_IDENTITY를 여기서 강제했더니 SPM 패키지
          # 타깃에까지 적용돼 "KakaoMapsSDK-SPM requires a development team"이 났고,
          # 자동 서명과 충돌해 "conflicting provisioning settings"까지 났다.
          # 서명 방식은 project.yml에서 자동으로 정해 두고, 팀만 xcconfig로 준다.
          #
          # 아카이브를 배포용으로 서명할 필요도 없다. 내보내기 단계가 App Store용
          # 프로파일로 다시 서명한다. 그게 정상 흐름이다.
          #
          # 빌드 번호는 올라가기만 하면 된다. 같은 번호를 두 번 올리면 거부당한다.
          xcodebuild archive \
            -project MapLine.xcodeproj \
            -scheme MapLine \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ../MapLine.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME"/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            KAKAO_NATIVE_APP_KEY="$KAKAO_NATIVE_APP_KEY" \
            API_BASE_URL="$API_BASE_URL"

          # 아카이브에 팀이 실제로 들어갔는지 바로 확인한다.
          # 여기서 비어 있으면 내보내기가 어차피 실패하므로 원인을 앞당겨 알린다.
          TEAM_IN_ARCHIVE=$(plutil -extract ApplicationProperties.Team raw -o - \
            ../MapLine.xcarchive/Info.plist 2>/dev/null || echo "")
          if [ -z "$TEAM_IN_ARCHIVE" ]; then
            echo "❌ 아카이브에 팀이 없다. 서명이 실제로 붙지 않았다."
            plutil -p ../MapLine.xcarchive/Info.plist | head -40
            exit 1
          fi
          echo "✅ 아카이브에 들어간 팀: $TEAM_IN_ARCHIVE"
          echo "ARCHIVE_TEAM=$TEAM_IN_ARCHIVE" >> "$GITHUB_ENV"

      - name: 내보내고 올린다
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ steps.team.outputs.TEAM_ID }}
        run: |
          set -o pipefail
          # 변수로 지정하지 않았으면 아카이브에 실제로 들어간 팀을 쓴다.
          TEAM_ID="${TEAM_ID:-$ARCHIVE_TEAM}"
          # destination을 upload로 두면 내보내기와 업로드가 한 번에 끝난다.
          # altool은 오래돼서 쓰지 않는다.
          # 팀을 모르면 teamID 항목을 아예 빼야 한다. 빈 문자열을 넣으면
          # "팀 없음"이 아니라 "이름이 빈 팀"으로 읽혀 서명이 실패한다.
          TEAM_ENTRY=""
          if [ -n "$TEAM_ID" ]; then
            TEAM_ENTRY="<key>teamID</key><string>$TEAM_ID</string>"
          fi

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            $TEAM_ENTRY
            <key>signingStyle</key><string>automatic</string>
            <!-- archive에서 정한 github.run_number를 App Store Connect가 다시 다음 번호로
                 바꾸지 않게 한다. 로그와 실제 TestFlight 빌드 번호가 같아야 한다. -->
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          echo "--- ExportOptions ---"; cat ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath MapLine.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME"/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 이번 CI 개발 인증서를 회수한다
        if: always()
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          if [ -f "$KEY_PATH" ]; then
            python3 scripts/apple_certificate_cleanup.py \
              "$KEY_ID" "$ISSUER_ID" "$KEY_PATH"
          else
            echo "API 키 파일이 없어 인증서 정리를 건너뛴다."
          fi

      - name: 키를 지운다
        if: always()
        run: rm -rf ~/private_keys

      - name: 실패하면 로그를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Developer/Xcode/DerivedData/**/Logs
          if-no-files-found: ignore
          retention-days: 3

# TestFlight 업로드.
#
# 실기기에서만 확인되는 것들이 쌓여 있다 — 손그림 손맛, 공유 익스텐션이 카카오맵에서
# 실제로 받는 값, App Group 저장. 시뮬레이터로는 여기까지가 한계다.
#
# 서명은 인증서 저장소를 따로 두지 않는다(fastlane match 같은 방식). 대신 xcodebuild가
# App Store Connect API 키로 직접 인증서와 프로파일을 발급받게 한다. 관리할 것이 줄고,
# 키가 저장소에 들어가지 않는다.
name: TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 필요한 값이 다 있는지 먼저 본다
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # 30분짜리 빌드를 다 돌리고 마지막에 "값이 없다"로 실패하면 시간이 아깝다.
          missing=""
          [ -z "$KEY_ID" ]      && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]   && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$PRIVATE_KEY" ] && missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "❌ 빠진 시크릿:$missing"
            exit 1
          fi
          echo "✅ 시크릿은 다 있다"

      - name: 도구 버전
        run: xcodebuild -version

      - name: API 키를 xcodebuild가 찾는 자리에 둔다
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # 도구마다 키를 찾는 자리가 다르다. altool은 ~/.appstoreconnect/private_keys를,
          # xcodebuild는 넘겨준 경로를 본다. 어디를 보든 걸리도록 양쪽에 둔다.
          for dir in ~/private_keys ~/.appstoreconnect/private_keys; do
            mkdir -p "$dir"
            printf '%s' "$PRIVATE_KEY" > "$dir/AuthKey_${KEY_ID}.p8"
            chmod 600 "$dir/AuthKey_${KEY_ID}.p8"
          done

          # 내용은 절대 찍지 않는다. 형식만 확인한다.
          head -1 ~/private_keys/AuthKey_${KEY_ID}.p8 | grep -q "BEGIN PRIVATE KEY" \
            && echo "✅ 키 형식 정상" \
            || { echo "❌ .p8 내용이 아니다. BEGIN/END 줄까지 통째로 넣었는지 확인하라"; exit 1; }

      - name: 팀 ID 알아내기
        id: team
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          OVERRIDE: ${{ vars.APPLE_TEAM_ID }}
        run: |
          # 사람에게 물어보지 않는다. 이미 넣어 준 API 키로 알 수 있는 값이다.
          # 팀이 여럿인 계정만 APPLE_TEAM_ID 변수로 직접 지정하면 된다.
          if [ -n "$OVERRIDE" ]; then
            echo "TEAM_ID=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "✅ 변수로 지정된 팀: $OVERRIDE"
            exit 0
          fi

          # stderr를 버리지 않는다. 실패했을 때 왜인지가 거기 있다.
          set +e
          RAW=$(xcrun altool --list-providers --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format json 2>altool.err)
          STATUS=$?
          set -e

          echo "--- altool 종료 코드: $STATUS ---"
          if [ -s altool.err ]; then
            echo "--- altool 오류 출력 ---"
            # 키 값이 섞여 나올 일은 없지만 혹시 몰라 길이를 제한한다.
            head -c 2000 altool.err
            echo ""
          fi
          if [ -n "$RAW" ]; then
            echo "--- 응답에서 팀 정보만 ---"
            printf '%s' "$RAW" | jq -r '.providers // [] | .[] | "\(.WWDRTeamID) \(.ProviderShortname)"' 2>/dev/null || echo "(JSON 파싱 실패)"
          fi

          COUNT=$(printf '%s' "$RAW" | jq '.providers | length' 2>/dev/null || echo 0)
          if [ "$COUNT" = "0" ] || [ -z "$COUNT" ] || [ "$COUNT" = "null" ]; then
            echo ""
            echo "❌ API 키로 팀을 찾지 못했다. 위 오류 출력을 보라."
            echo "   빠른 우회: developer.apple.com > Account > Membership 의 Team ID(10자리)를"
            echo "   저장소 Settings > Secrets and variables > Actions > Variables 탭에"
            echo "   APPLE_TEAM_ID 로 넣으면 이 단계를 통째로 건너뛴다."
            exit 1
          fi

          printf '%s' "$RAW" | jq -r '.providers[] | "  - \(.WWDRTeamID)  \(.ProviderShortname)"'

          if [ "$COUNT" != "1" ]; then
            echo "❌ 팀이 여러 개다. 위 목록에서 골라 APPLE_TEAM_ID 변수에 넣어라."
            exit 1
          fi

          TEAM=$(printf '%s' "$RAW" | jq -r '.providers[0].WWDRTeamID')
          echo "TEAM_ID=$TEAM" >> "$GITHUB_OUTPUT"
          echo "✅ 팀 ID를 알아냈다: $TEAM"

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: ios
        env:
          TEAM_ID: ${{ steps.team.outputs.TEAM_ID }}
        run: |
          # 서명에 팀이 필요하다. 로컬 빌드용 xcconfig 자리를 그대로 쓴다.
          cat > Config.xcconfig <<EOF
          DEVELOPMENT_TEAM = $TEAM_ID
          EOF
          xcodegen generate

      - name: 아카이브
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://map-line-production.up.railway.app' }}
        run: |
          set -o pipefail
          # 빌드 번호는 올라가기만 하면 된다. 같은 번호를 두 번 올리면 거부당한다.
          xcodebuild archive \
            -project MapLine.xcodeproj \
            -scheme MapLine \
            -destination 'generic/platform=iOS' \
            -archivePath ../MapLine.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            KAKAO_NATIVE_APP_KEY="$KAKAO_NATIVE_APP_KEY" \
            API_BASE_URL="$API_BASE_URL"

      - name: 내보내고 올린다
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ steps.team.outputs.TEAM_ID }}
        run: |
          set -o pipefail
          # destination을 upload로 두면 내보내기와 업로드가 한 번에 끝난다.
          # altool은 오래돼서 쓰지 않는다.
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath MapLine.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 키를 지운다
        if: always()
        run: rm -rf ~/private_keys

      - name: 실패하면 로그를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Developer/Xcode/DerivedData/**/Logs
          if-no-files-found: ignore
          retention-days: 3

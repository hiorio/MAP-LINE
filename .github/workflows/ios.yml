# iOS 빌드·테스트.
#
# 개발 환경이 윈도우라 맥이 없다. 이 저장소가 public이므로 GitHub의 macOS 러너를
# 무료로 쓸 수 있고, 여기가 사실상 유일한 컴파일러다. 그래서 실패해도 로그만으로
# 원인을 알 수 있게 단계를 잘게 나누고 시뮬레이터 목록도 찍어 둔다.
name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 도구 버전 확인
        run: |
          xcodebuild -version
          swift --version

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: ios
        run: |
          # Config.xcconfig는 맥에서 직접 빌드할 때 쓰는 로컬 파일이라 저장소에 없다.
          # project.yml이 이 경로를 참조하므로 CI에서는 빈 파일을 만들어 둔다.
          # 실제 값은 xcodebuild 인자로 넘기고, 명령줄 인자가 xcconfig보다 우선한다.
          [ -f Config.xcconfig ] || echo "// CI에서 생성됨" > Config.xcconfig
          xcodegen generate
          ls -la MapLine.xcodeproj

      - name: 시뮬레이터 목록
        # 기기 이름은 Xcode 버전마다 달라진다. 대상 지정이 틀렸을 때 여기를 보면 된다.
        run: xcrun simctl list devices available | sed -n '/iOS/,$p'

      - name: 빌드
        working-directory: ios
        env:
          # 앱 키가 없어도 빌드는 된다. 지도 타일만 뜨지 않는다.
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -o pipefail
          # 시크릿이 아직 없으면 배관 검증용 표식을 넣는다. 그래야 "키가 없는 것"과
          # "경로가 끊긴 것"을 구별할 수 있다. 둘 다 빈 문자열로 끝나면 알 수가 없다.
          KEY="${KAKAO_NATIVE_APP_KEY:-PLUMBING_CHECK_SENTINEL}"
          echo "KEY_SENT=$KEY" >> "$GITHUB_ENV"
          xcodebuild build \
            -project MapLine.xcodeproj \
            -scheme MapLine \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            KAKAO_NATIVE_APP_KEY="$KEY"

      - name: 앱 키가 실제로 번들에 들어갔는지 확인
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -name 'MapLine.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then echo "빌드 결과를 찾지 못했다"; exit 1; fi
          echo "앱: $APP"

          VALUE=$(plutil -extract KakaoNativeAppKey raw -o - "$APP/Info.plist" 2>/dev/null || echo "")
          if [ -z "$VALUE" ]; then
            echo "❌ Info.plist에 KakaoNativeAppKey가 비어 있다. 치환이 안 됐다."
            plutil -p "$APP/Info.plist" | head -30
            exit 1
          fi
          if [ "$VALUE" = '$(KAKAO_NATIVE_APP_KEY)' ]; then
            echo "❌ 치환되지 않고 변수 이름 그대로 들어갔다."
            exit 1
          fi
          if [ "$VALUE" != "$KEY_SENT" ]; then
            echo "❌ 넘긴 값과 번들에 든 값이 다르다 (길이 ${#VALUE} vs ${#KEY_SENT})"
            exit 1
          fi

          # 실제 키는 로그에 남기지 않는다. 길이만 보고도 배관은 확인된다.
          if [ "$VALUE" = "PLUMBING_CHECK_SENTINEL" ]; then
            echo "✅ 배관 정상. 아직 시크릿은 비어 있다 (표식이 그대로 왔다)."
          else
            echo "✅ 배관 정상. 실제 키가 들어갔다 (길이 ${#VALUE})."
          fi

      - name: 도메인 테스트
        working-directory: ios
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v))")
          echo "시뮬레이터: $DEVICE"
          xcodebuild test \
            -project MapLine.xcodeproj \
            -scheme MapLine \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            KAKAO_NATIVE_APP_KEY="$KAKAO_NATIVE_APP_KEY"

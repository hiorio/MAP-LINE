# XcodeGen 설정.
#
# .xcodeproj를 손으로 쓰지 않고 이 파일에서 만들어 낸다. pbxproj는 사람이 읽기도
# 고치기도 어렵고 충돌이 잦은데, 여기서는 무엇이 바뀌었는지 diff로 읽힌다.
# CI에서 `xcodegen generate` 한 줄로 프로젝트를 만든 뒤 빌드한다.
#
# 번들 ID는 아직 정해지지 않았다. bundleIdPrefix만 바꾸면 전부 따라온다.
name: MapLine
options:
  bundleIdPrefix: com.hiorio
  # iOS 16부터. NavigationStack 같은 요즘 API를 쓰려면 최소한 여기다.
  # 카카오 SDK는 13부터 되지만 그 아래를 붙들 이유가 없다. 필요하면 여기만 고친다.
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  KakaoMapsSDK:
    url: https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM
    from: 2.12.17

configFiles:
  # 맥에서 직접 빌드할 때의 앱 키 출처. 웹의 .env.local에 해당하고 gitignore된다.
  # CI에는 이 파일이 없으므로 워크플로가 빈 파일을 먼저 만들고, 값은 xcodebuild
  # 인자로 넘긴다. 명령줄 인자가 xcconfig보다 우선한다.
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  MapLine:
    type: application
    platform: iOS
    sources:
      - path: MapLine
      # 앱과 공유 익스텐션이 같은 모델·저장소·설정을 쓴다. 익스텐션은 별도 프로세스라
      # 코드를 공유하려면 양쪽 타깃에 같은 소스를 넣어야 한다.
      - path: Shared
    dependencies:
      - target: ShareExtension
        embed: true
      # 정적 라이브러리 쪽을 쓴다. 동적(KakaoMapsSDK-SPM-Dynamic)은 앱 실행 시
      # 프레임워크 임베드가 따로 필요해 스파이크에는 군더더기다.
      - package: KakaoMapsSDK
        product: KakaoMapsSDK-SPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiorio.mapline
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # 서명은 CI(시뮬레이터 빌드)에서 필요 없다. 실기기 배포 때 켠다.
        CODE_SIGNING_ALLOWED: NO
    info:
      path: MapLine/Info.plist
      properties:
        CFBundleDisplayName: MAP-LINE
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 앱 키는 저장소에 넣지 않는다. Config.xcconfig(gitignore)나 CI 시크릿에서 온다.
        KakaoNativeAppKey: $(KAKAO_NATIVE_APP_KEY)
        ApiBaseURL: $(API_BASE_URL)
    entitlements:
      path: MapLine/MapLine.entitlements
      properties:
        # 익스텐션이 담은 장소를 앱이 읽으려면 둘이 같은 컨테이너를 봐야 한다.
        com.apple.security.application-groups:
          - group.com.hiorio.mapline

  # 다른 앱에서 "공유"로 넘어온 장소를 보관함에 담는다.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiorio.mapline.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 보관함에 담기
        ApiBaseURL: $(API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # 텍스트와 링크만 받는다. TRUEPREDICATE는 앱스토어 심사에서 막힌다.
            # 어느 지도 앱이 무엇을 넘기는지 달라서 둘 다 열어 둔다.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hiorio.mapline

  MapLineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Shared는 여기에 넣지 않는다. MapLine 타깃이 이미 품고 있고
      # @testable import로 닿는다. 양쪽에 넣으면 같은 타입이 두 벌 생겨 이름이 겹친다.
      - path: MapLineTests
    dependencies:
      - target: MapLine
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  # 스파이크의 판정을 맡는다. 지도를 띄우고 선을 그어 스크린샷을 남긴다.
  # 유닛 테스트와 나눠 두는 이유: 이쪽은 시뮬레이터 렌더링과 앱 키에 기대므로
  # 환경 탓으로 깨질 수 있다. 도메인 규칙 검증까지 같이 빨개지면 안 된다.
  MapLineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MapLineUITests
    dependencies:
      - target: MapLine
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: MapLine

schemes:
  MapLine:
    build:
      targets:
        MapLine: all
        MapLineTests: [test]
    test:
      targets:
        - MapLineTests
    # 아카이브는 배포 설정으로 한다. 안 정하면 Debug로 잡혀 개발용 프로비저닝
    # 프로파일을 찾다가 "No profiles ... iOS App Development"로 죽는다.
    archive:
      config: Release

  # 별도 스킴으로 둔다. 도메인 테스트는 항상 돌리고, 이건 필요할 때만 돌린다.
  MapLineUI:
    build:
      targets:
        MapLine: all
        MapLineUITests: [test]
    test:
      targets:
        - MapLineUITests
